[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "relinkbox"
version = "0.2.0"
description = "Relink Rekordbox library tracks to files on disk"
readme = "README.md"
requires-python = ">=3.10,<3.15"
dependencies = [
    "PySide6>=6.7,<6.13",
    "pyrekordbox>=0.4.0,<0.5",
    "rapidfuzz>=3.9,<4",
]

[project.optional-dependencies]
build = ["pyinstaller>=6.16"]
dev = ["pytest>=8"]

[project.scripts]
relinkbox = "relinkbox.app:main"

[tool.setuptools.packages.find]
include = ["relinkbox*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
