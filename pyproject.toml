[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "relinkbox"
version = "0.2.0"
description = "Relink Rekordbox library tracks to files on disk"
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: Microsoft :: Windows",
    "Environment :: Win32 (MS Windows)",
    "Intended Audience :: End Users/Desktop",
    "Topic :: Multimedia :: Sound/Audio",
]
requires-python = ">=3.10,<3.15"
dependencies = [
    "PySide6>=6.7,<6.13",
    "pyrekordbox>=0.4.0,<0.5",
    "rapidfuzz>=3.9,<4",
]

[project.urls]
Homepage = "https://github.com/TALE5/relinkbox"
Issues = "https://github.com/TALE5/relinkbox/issues"

[project.optional-dependencies]
build = ["pyinstaller>=6.16"]
dev = ["pytest>=8"]

[project.scripts]
relinkbox = "relinkbox.app:main"

[tool.setuptools.packages.find]
include = ["relinkbox*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
